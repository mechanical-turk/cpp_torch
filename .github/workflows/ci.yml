name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict:
    name: Strict (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macOS Apple Clang
            os: macos-15
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure strict preset
        run: cmake --preset strict

      - name: Build
        run: cmake --build --preset strict

      - name: Test
        run: ctest --preset strict

  sanitized:
    name: ASan and UBSan (Linux Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure sanitized preset
        run: cmake --preset sanitized

      - name: Build
        run: cmake --build --preset sanitized

      - name: Test
        run: ctest --preset sanitized

  optimized-builds:
    name: Release and benchmark builds (Linux GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Release preset
        run: cmake --preset release

      - name: Build Release
        run: cmake --build --preset release

      - name: Configure benchmark preset
        run: cmake --preset benchmark

      - name: Build benchmarks
        run: cmake --build --preset benchmark
