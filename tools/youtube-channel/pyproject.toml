[project]
name = "dlatwd-youtube-channel"
version = "0.1.0"
description = "Private local YouTube analytics and channel-management tooling"
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.179,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.scripts]
youtube-channel = "youtube_channel:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_channel.py"]
