[project]
name = "dlatwd-phyllo-analytics"
version = "0.1.0"
description = "Experimental local Phyllo analytics collector"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
phyllo-analytics = "phyllo_analytics:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phyllo_analytics.py"]
