<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1176" viewBox="0 0 1080 1176">
  <defs>
    <style>
      .shape {
        fill: #26c6ef;
        font-family: "Helvetica Neue";
        font-size: 150px;
        font-weight: 700;
        font-style: normal;
        text-anchor: middle;
      }

      .heading {
        fill: #f4f4f2;
        font-family: "Helvetica Neue";
        font-size: 28px;
        font-weight: 600;
        font-style: normal;
        letter-spacing: 0;
        text-anchor: middle;
      }

      .metadata-label {
        fill: #eeeeec;
        font-family: "Helvetica Neue";
        font-size: 36px;
        font-weight: 400;
        font-style: normal;
      }

      .metadata-value {
        fill: #f7f7f5;
        font-family: "Helvetica Neue";
        font-size: 38px;
        font-weight: 600;
        font-style: normal;
        text-anchor: end;
      }
    </style>

    <g id="value-cell">
      <rect width="180" height="180" rx="14" fill="#26c6ef"/>
      <text x="90" y="128"
            fill="#0e1012"
            font-family="Helvetica Neue"
            font-size="104"
            font-weight="600"
            font-style="normal"
            text-anchor="middle">7</text>
    </g>

    <path id="left-bracket"
          d="M 0 0 H 38 V 14 H 16 V 166 H 38 V 180 H 0 Z"
          fill="#26c6ef"/>

    <path id="right-bracket"
          d="M 38 0 H 0 V 14 H 22 V 166 H 0 V 180 H 38 Z"
          fill="#26c6ef"/>
  </defs>

  <rect width="1080" height="1176" fill="#0e1012"/>

  <rect x="359" y="54" width="3" height="1068" fill="#8f8f8f"/>
  <rect x="719" y="54" width="3" height="1068" fill="#8f8f8f"/>

  <text class="shape" x="135" y="286">[</text>
  <text class="shape" x="225" y="286">]</text>
  <text class="shape" x="540" y="286">[1]</text>
  <text class="shape" x="900" y="286">[0]</text>

  <text class="heading" x="180" y="390">SCALAR</text>
  <text class="heading" x="540" y="390">SINGLETON VECTOR</text>
  <text class="heading" x="900" y="390">EMPTY VECTOR</text>

  <text class="metadata-label" x="48" y="600">rank</text>
  <text class="metadata-value" x="312" y="600">0</text>
  <text class="metadata-label" x="408" y="600">rank</text>
  <text class="metadata-value" x="672" y="600">1</text>
  <text class="metadata-label" x="768" y="600">rank</text>
  <text class="metadata-value" x="1032" y="600">1</text>

  <text class="metadata-label" x="48" y="675">elements</text>
  <text class="metadata-value" x="312" y="675">1</text>
  <text class="metadata-label" x="408" y="675">elements</text>
  <text class="metadata-value" x="672" y="675">1</text>
  <text class="metadata-label" x="768" y="675">elements</text>
  <text class="metadata-value" x="1032" y="675">0</text>

  <use href="#value-cell" x="90" y="860"/>

  <use href="#left-bracket" x="395" y="860"/>
  <use href="#value-cell" x="450" y="860"/>
  <use href="#right-bracket" x="647" y="860"/>

  <use href="#left-bracket" x="785" y="860"/>
  <use href="#right-bracket" x="977" y="860"/>
