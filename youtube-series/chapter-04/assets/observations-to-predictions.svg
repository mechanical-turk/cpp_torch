<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020814"/>
      <stop offset="0.55" stop-color="#071526"/>
      <stop offset="1" stop-color="#020711"/>
    </linearGradient>
    <linearGradient id="blueCell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123b68"/>
      <stop offset="1" stop-color="#071a32"/>
    </linearGradient>
    <linearGradient id="orangeCell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#743a08"/>
      <stop offset="1" stop-color="#2d1604"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#16304a" stroke-width="1" opacity="0.32"/>
    </pattern>
    <filter id="blueGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orangeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="blue-cell">
      <rect width="118" height="118" rx="10" fill="url(#blueCell)" stroke="#2eb8ff" stroke-width="3.5"/>
      <rect x="7" y="7" width="104" height="104" rx="6" fill="none" stroke="#8ad9ff" stroke-width="1.4" opacity="0.55"/>
    </g>
    <g id="orange-cell">
      <rect width="118" height="118" rx="10" fill="url(#orangeCell)" stroke="#ff9d19" stroke-width="3.5"/>
      <rect x="7" y="7" width="104" height="104" rx="6" fill="none" stroke="#ffd17d" stroke-width="1.4" opacity="0.62"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
