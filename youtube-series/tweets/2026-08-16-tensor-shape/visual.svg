<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18304f" stroke-width="1" opacity="0.42"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020817" flood-opacity="0.48"/>
    </filter>
    <g id="cell">
      <rect width="54" height="54" rx="8" fill="#163b66" stroke="#56b7ff" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#071321"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="800" y="76" fill="#f4f8fc" font-family="Helvetica Neue, Arial, sans-serif"
        font-size="48" font-weight="700" text-anchor="middle" letter-spacing="1">
    THE VALUES DO NOT DETERMINE THE SHAPE
  </text>

  <text x="800" y="128" fill="#9eb4ca" font-family="SFMono-Regular, Menlo, monospace"
        font-size="25" text-anchor="middle">data = [1, 2, 3, 4, 5, 6]</text>

  <g transform="translate(605 158)">
    <use href="#cell" x="0"/><use href="#cell" x="66"/><use href="#cell" x="132"/>
    <use href="#cell" x="198"/><use href="#cell" x="264"/><use href="#cell" x="330"/>
    <g fill="#f4f8fc" font-family="SFMono-Regular, Menlo, monospace" font-size="23" text-anchor="middle">
      <text x="27" y="36">1</text><text x="93" y="36">2</text><text x="159" y="36">3</text>
      <text x="225" y="36">4</text><text x="291" y="36">5</text><text x="357" y="36">6</text>
    </g>
  </g>

  <path d="M800 230 V270 M800 270 H400 V300 M800 270 H1200 V300"
        fill="none" stroke="#ed8b42" stroke-width="3" stroke-linecap="round"/>

  <!-- shape [6] -->
  <g transform="translate(90 300)" filter="url(#shadow)">
    <rect width="680" height="230" rx="18" fill="#0d2035" stroke="#284a6d" stroke-width="2"/>
    <text x="34" y="50" fill="#f4f8fc" font-family="SFMono-Regular, Menlo, monospace"
          font-size="28" font-weight="700">shape = [6]</text>
    <g transform="translate(141 95)">
      <text x="-34" y="43" fill="#9eb4ca" font-family="Helvetica Neue, Arial, sans-serif" font-size="54">[</text>
      <use href="#cell" x="0"/><use href="#cell" x="66"/><use href="#cell" x="132"/>
      <use href="#cell" x="198"/><use href="#cell" x="264"/><use href="#cell" x="330"/>
      <text x="404" y="43" fill="#9eb4ca" font-family="Helvetica Neue, Arial, sans-serif" font-size="54">]</text>
      <g fill="#f4f8fc" font-family="SFMono-Regular, Menlo, monospace" font-size="23" text-anchor="middle">
        <text x="27" y="36">1</text><text x="93" y="36">2</text><text x="159" y="36">3</text>
        <text x="225" y="36">4</text><text x="291" y="36">5</text><text x="357" y="36">6</text>
      </g>
    </g>
  </g>

  <!-- shape [2,3] -->
  <g transform="translate(830 300)" filter="url(#shadow)">
    <rect width="680" height="230" rx="18" fill="#0d2035" stroke="#284a6d" stroke-width="2"/>
    <text x="34" y="50" fill="#f4f8fc" font-family="SFMono-Regular, Menlo, monospace"
          font-size="28" font-weight="700">shape = [2, 3]</text>
    <g transform="translate(250 76)">
      <path d="M-18 -4 H-34 V124 H-18" fill="none" stroke="#9eb4ca" stroke-width="10"/>
      <use href="#cell" x="0" y="0"/><use href="#cell" x="66" y="0"/><use href="#cell" x="132" y="0"/>
      <use href="#cell" x="0" y="66"/><use href="#cell" x="66" y="66"/><use href="#cell" x="132" y="66"/>
      <path d="M198 -4 H214 V124 H198" fill="none" stroke="#9eb4ca" stroke-width="10"/>
      <g fill="#f4f8fc" font-family="SFMono-Regular, Menlo, monospace" font-size="23" text-anchor="middle">
        <text x="27" y="36">1</text><text x="93" y="36">2</text><text x="159" y="36">3</text>
        <text x="27" y="102">4</text><text x="93" y="102">5</text><text x="159" y="102">6</text>
      </g>
    </g>
  </g>

  <!-- shape [3,2] -->
  <g transform="translate(90 570)" filter="url(#shadow)">
    <rect width="680" height="280" rx="18" fill="#0d2035" stroke="#284a6d" stroke-width="2"/>
    <text x="34" y="50" fill="#f4f8fc" font-family="SFMono-Regular, Menlo, monospace"
          font-size="28" font-weight="700">shape = [3, 2]</text>
    <g transform="translate(277 72)">
      <path d="M-18 -4 H-34 V190 H-18" fill="none" stroke="#9eb4ca" stroke-width="10"/>
      <use href="#cell" x="0" y="0"/><use href="#cell" x="66" y="0"/>
      <use href="#cell" x="0" y="66"/><use href="#cell" x="66" y="66"/>
      <use href="#cell" x="0" y="132"/><use href="#cell" x="66" y="132"/>
      <path d="M150 -4 H166 V190 H150" fill="none" stroke="#9eb4ca" stroke-width="10"/>
      <g fill="#f4f8fc" font-family="SFMono-Regular, Menlo, monospace" font-size="23" text-anchor="middle">
        <text x="27" y="36">1</text><text x="93" y="36">2</text>
        <text x="27" y="102">3</text><text x="93" y="102">4</text>
        <text x="27" y="168">5</text><text x="93" y="168">6</text>
      </g>
    </g>
  </g>

  <!-- shape [1,1,6] -->
  <g transform="translate(830 570)" filter="url(#shadow)">
    <rect width="680" height="280" rx="18" fill="#0d2035" stroke="#284a6d" stroke-width="2"/>
    <text x="34" y="50" fill="#f4f8fc" font-family="SFMono-Regular, Menlo, monospace"
          font-size="28" font-weight="700">shape = [1, 1, 6]</text>
    <g transform="translate(141 116)">
      <text x="-71" y="43" fill="#9eb4ca" font-family="Helvetica Neue, Arial, sans-serif" font-size="54">[[[</text>
      <use href="#cell" x="0"/><use href="#cell" x="66"/><use href="#cell" x="132"/>
      <use href="#cell" x="198"/><use href="#cell" x="264"/><use href="#cell" x="330"/>
      <text x="404" y="43" fill="#9eb4ca" font-family="Helvetica Neue, Arial, sans-serif" font-size="54">]]]</text>
      <g fill="#f4f8fc" font-family="SFMono-Regular, Menlo, monospace" font-size="23" text-anchor="middle">
        <text x="27" y="36">1</text><text x="93" y="36">2</text><text x="159" y="36">3</text>
        <text x="225" y="36">4</text><text x="291" y="36">5</text><text x="357" y="36">6</text>
      </g>
    </g>
  </g>
</svg>
